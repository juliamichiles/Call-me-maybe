[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling tool using constrained decoding with Qwen3-0.6B"
readme = "README.md"
authors = [
    { name = "juliatav", email = "juliatav@student.42porto.com" }
]
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[project.scripts]
call-me-maybe = "call_me_maybe:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]
